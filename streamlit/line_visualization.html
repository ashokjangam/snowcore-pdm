<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Floor Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        #container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .factory-line {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        .process-flow {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            overflow-x: auto;
            padding: 20px 0;
        }
        .process {
            min-width: 200px;
            flex-shrink: 0;
        }
        .process-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .process-number {
            width: 50px;
            height: 50px;
            background: #2196F3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin: 0 auto 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .process-name {
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            word-wrap: break-word;
        }
        .arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: rgba(255, 255, 255, 0.5);
            padding-top: 50px;
        }
        .assets {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .asset {
            background: #fff;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border-left: 5px solid;
        }
        .asset:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }
        .asset.healthy {
            border-left-color: #4CAF50;
            background: linear-gradient(135deg, #ffffff 0%, #e8f5e9 100%);
        }
        .asset.warning {
            border-left-color: #FFC107;
            background: linear-gradient(135deg, #ffffff 0%, #fff9e6 100%);
        }
        .asset.critical {
            border-left-color: #F44336;
            background: linear-gradient(135deg, #ffffff 0%, #ffebee 100%);
        }
        .asset-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        .asset-stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .stat {
            font-size: 12px;
            color: #666;
        }
        .stat strong {
            color: #333;
        }
        .health-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        .health-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
        .health-fill.healthy { background: #4CAF50; }
        .health-fill.warning { background: #FFC107; }
        .health-fill.critical { background: #F44336; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            overflow-y: auto;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #666;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: #f0f0f0;
            color: #333;
        }
        .modal-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            padding-right: 40px;
        }
        .modal-section {
            margin-bottom: 20px;
        }
        .modal-section h3 {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 5px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        .info-item {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
        }
        .info-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        .sensor-item {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .sensor-type {
            font-size: 11px;
            color: #999;
            margin-bottom: 5px;
        }
        .sensor-value {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .sensor-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 5px;
        }
        .sensor-status.normal { background: #4CAF50; }
        .sensor-status.warning { background: #FFC107; }
        .sensor-status.critical { background: #F44336; }
        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .legend-color {
            width: 30px;
            height: 20px;
            border-radius: 4px;
        }
        .no-data {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>🏭 Factory Floor Visualization</h1>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: #4CAF50;"></div>
                <span>Healthy (≥70%)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFC107;"></div>
                <span>Warning (50-70%)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #F44336;"></div>
                <span>Critical (&lt;50%)</span>
            </div>
        </div>
        
        <div class="factory-line" id="factory-container">
            <div class="no-data">Loading factory data...</div>
        </div>
    </div>

    <div class="modal" id="asset-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // Data will be injected here
        const factoryData = __REPLACE_WITH_LIVE_DATA__;
        
        console.log('Factory data loaded:', factoryData);
        
        function getHealthClass(healthScore) {
            if (healthScore >= 0.7) return 'healthy';
            if (healthScore >= 0.5) return 'warning';
            return 'critical';
        }
        
        function renderFactory() {
            const container = document.getElementById('factory-container');
            
            if (!factoryData || !factoryData.children || factoryData.children.length === 0) {
                container.innerHTML = '<div class="no-data">No factory data available</div>';
                return;
            }
            
            const line = factoryData.children[0];
            const processes = line.children || [];
            
            if (processes.length === 0) {
                container.innerHTML = '<div class="no-data">No processes found in this production line</div>';
                return;
            }
            
            let html = '<div class="process-flow">';
            
            processes.forEach((process, processIndex) => {
                // Process container
                html += '<div class="process">';
                html += '  <div class="process-header">';
                html += `    <div class="process-number">${processIndex + 1}</div>`;
                html += `    <div class="process-name">${escapeHtml(process.name)}</div>`;
                html += '  </div>';
                
                // Assets in this process
                const assets = process.children || [];
                if (assets.length > 0) {
                    html += '  <div class="assets">';
                    assets.forEach(asset => {
                        const healthScore = asset.healthScore || 0.8;
                        const healthClass = getHealthClass(healthScore);
                        const healthPercent = Math.round(healthScore * 100);
                        
                        html += `    <div class="asset ${healthClass}" onclick='showAssetDetails(${JSON.stringify(asset)})'>`;
                        html += `      <div class="asset-name">${escapeHtml(asset.name)}</div>`;
                        html += `      <div class="asset-stats">`;
                        html += `        <div class="stat"><strong>Health:</strong> ${healthPercent}%</div>`;
                        html += `        <div class="stat"><strong>Status:</strong> ${escapeHtml(asset.status || 'Online')}</div>`;
                        html += `      </div>`;
                        html += `      <div class="health-bar">`;
                        html += `        <div class="health-fill ${healthClass}" style="width: ${healthPercent}%"></div>`;
                        html += `      </div>`;
                        html += `    </div>`;
                    });
                    html += '  </div>';
                }
                
                html += '</div>';
                
                // Arrow between processes (except after last one)
                if (processIndex < processes.length - 1) {
                    html += '<div class="arrow">→</div>';
                }
            });
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        function showAssetDetails(asset) {
            const modal = document.getElementById('asset-modal');
            const modalBody = document.getElementById('modal-body');
            
            const healthScore = asset.healthScore || 0.8;
            const healthClass = getHealthClass(healthScore);
            const healthPercent = Math.round(healthScore * 100);
            
            let html = `<div class="modal-title">${escapeHtml(asset.name)}</div>`;
            
            // Main stats
            html += '<div class="modal-section">';
            html += '  <h3>Overview</h3>';
            html += '  <div class="info-grid">';
            html += `    <div class="info-item">`;
            html += `      <div class="info-label">Health Score</div>`;
            html += `      <div class="info-value" style="color: ${getHealthColor(healthScore)}">${healthPercent}%</div>`;
            html += `    </div>`;
            html += `    <div class="info-item">`;
            html += `      <div class="info-label">Status</div>`;
            html += `      <div class="info-value">${escapeHtml(asset.status || 'Online')}</div>`;
            html += `    </div>`;
            html += `    <div class="info-item">`;
            html += `      <div class="info-label">Failure Probability</div>`;
            html += `      <div class="info-value">${escapeHtml(asset.pof || 'N/A')}</div>`;
            html += `    </div>`;
            html += `    <div class="info-item">`;
            html += `      <div class="info-label">Downtime Cost</div>`;
            html += `      <div class="info-value">${escapeHtml(asset.cost || 'N/A')}</div>`;
            html += `    </div>`;
            html += '  </div>';
            html += '</div>';
            
            // Sensors
            if (asset.children && asset.children.length > 0) {
                html += '<div class="modal-section">';
                html += '  <h3>Sensor Readings</h3>';
                html += '  <div class="sensor-grid">';
                asset.children.forEach(sensor => {
                    html += `    <div class="sensor-item">`;
                    html += `      <div class="sensor-type">${escapeHtml(sensor.type)}</div>`;
                    html += `      <div class="sensor-value">`;
                    html += `        ${sensor.value}${escapeHtml(sensor.unit)}`;
                    html += `        <span class="sensor-status ${sensor.status}"></span>`;
                    html += `      </div>`;
                    html += `    </div>`;
                });
                html += '  </div>';
                html += '</div>';
            }
            
            modalBody.innerHTML = html;
            modal.classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('asset-modal').classList.remove('active');
        }
        
        function getHealthColor(healthScore) {
            if (healthScore >= 0.7) return '#4CAF50';
            if (healthScore >= 0.5) return '#FFC107';
            return '#F44336';
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Close modal when clicking outside
        document.getElementById('asset-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        // Render the factory
        renderFactory();
        
        console.log('Factory visualization rendered');
    </script>
</body>
</html>
