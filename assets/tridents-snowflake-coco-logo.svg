<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">TRidents logo</title>
  <desc id="desc">A modern trident with a data snow crystal at its center, for the TRidents team in the Snowflake CoCo CLI Hackathon.</desc>
  <defs>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31C8F3"/>
      <stop offset=".5" stop-color="#397EF6"/>
      <stop offset="1" stop-color="#6D5BF5"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="1" stop-color="#B9D5E8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- transparent background; designed for light-mode upload surfaces -->
  <g transform="translate(130 30)">
    <circle cx="190" cy="190" r="151" fill="#0B1B31" stroke="url(#ice)" stroke-width="12"/>
    <circle cx="190" cy="190" r="126" fill="none" stroke="#31506C" stroke-width="2"/>
    <path d="M190 53v274M109 326h162" stroke="#2B4964" stroke-width="2"/>

    <!-- trident -->
    <g fill="none" stroke="url(#steel)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 324V139" stroke-width="17"/>
      <path d="M190 139V89M190 89l-24 29M190 89l24 29" stroke-width="14"/>
      <path d="M190 194c-52 0-82-31-82-76V90M108 90l-23 28M108 90l23 28" stroke-width="14"/>
      <path d="M190 194c52 0 82-31 82-76V90M272 90l-23 28M272 90l23 28" stroke-width="14"/>
      <path d="M157 325h66" stroke-width="17"/>
    </g>

    <!-- data/snow core -->
    <g stroke="#56D7FF" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
      <path d="M190 154v80M155 174l70 40M225 174l-70 40"/>
      <path d="M190 154l-9 14M190 154l9 14M190 234l-9-14M190 234l9-14"/>
      <path d="M155 174l17 1M155 174l8 15M225 214l-17-1M225 214l-8-15"/>
      <path d="M225 174l-17 1M225 174l-8 15M155 214l17-1M155 214l8-15"/>
    </g>
    <circle cx="190" cy="194" r="10" fill="#56D7FF"/>

    <!-- small signal nodes -->
    <circle cx="91" cy="245" r="5" fill="#F4B451"/>
    <circle cx="289" cy="245" r="5" fill="#F4B451"/>
    <path d="M97 241l34-22M283 241l-34-22" stroke="#F4B451" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- stacked wordmark, safe on white/light mode -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="320" y="432" fill="#15324D" font-size="68" font-weight="800" letter-spacing="-2">TRIDENTS</text>
    <path d="M154 462h332" stroke="#C9DBE9" stroke-width="2"/>
    <path d="M239 462h162" stroke="url(#ice)" stroke-width="5" stroke-linecap="round"/>
    <text x="320" y="502" fill="#4A687D" font-size="17" font-weight="700" letter-spacing="2.5">SNOWFLAKE COCO CLI HACKATHON</text>
    <text x="320" y="531" fill="#7891A4" font-size="14" font-weight="700" letter-spacing="2">GCC EDITION · 2026</text>
  </g>
</svg>
